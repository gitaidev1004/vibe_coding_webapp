# ch06/05_deployment/docker-compose.yml
# 프런트엔드, 백엔드(FastAPI 예시), 데이터베이스(PostgreSQL)를 한 번에 구동하는 설정.
# 백엔드를 Spring Boot나 Flask로 교체하려면 backend 서비스의 build/dockerfile만 바꾸면 된다.
version: "3.9"

services:
  frontend:
    build:
      context: ./vue_project
      dockerfile: ../Dockerfile.vue
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend_fastapi
      dockerfile: ../Dockerfile.fastapi
    environment:
      DATABASE_URL: postgresql://webapp:webapp_pw@db:5432/webapp
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webapp
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: webapp_pw
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
