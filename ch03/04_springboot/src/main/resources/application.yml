# ch03/04_springboot/src/main/resources/application.yml
# 실습에서는 별도 서버 설치가 필요 없는 H2 인메모리 데이터베이스를 사용한다.
# 실제 프로젝트에서는 아래 설정만 PostgreSQL 접속 정보로 교체하면 된다.
spring:
  datasource:
    url: jdbc:h2:mem:webapp;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
